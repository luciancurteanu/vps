---
# Common role: Handlers

- name: Restart ssh
  ansible.builtin.service:
    name: "{{ common_ssh_service_name }}"
    state: restarted

- name: Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: Restart chronyd
  ansible.builtin.service:
    name: chronyd
    state: restarted

- name: Step system clock with Chrony
  ansible.builtin.command: chronyc makestep
  changed_when: false
  failed_when: false
