---
# MariaDB installation and configuration tasks

- name: Add MariaDB official repository
  ansible.builtin.yum_repository:
    name: MariaDB
    description: "MariaDB {{ mariadb_version }} repository"
    baseurl: "{{ mariadb_repo_url }}"
    gpgkey: "{{ mariadb_repo_key }}"
    gpgcheck: true
    enabled: true
  when: ansible_os_family == "RedHat"

- name: Disable AppStream MariaDB module to avoid conflicts
  ansible.builtin.command: dnf module disable mariadb -y
  when: ansible_os_family == "RedHat"
  changed_when: false
  failed_when: false

- name: Check if AppStream mariadb-server is installed
  ansible.builtin.command: rpm -q mariadb-server
  register: appstream_mariadb_installed
  changed_when: false
  failed_when: false

- name: Remove AppStream MariaDB packages before installing official version
  ansible.builtin.dnf:
    name:
      - mariadb-server
      - mariadb
    state: absent
  when:
    - ansible_os_family == "RedHat"
    - appstream_mariadb_installed.rc == 0

- name: Install MariaDB server and client packages from official repository
  ansible.builtin.dnf:
    name:
      - MariaDB-server
      - MariaDB-client
      - python3-PyMySQL
    state: present
  when: ansible_os_family == "RedHat"

- name: Create MariaDB log directory
  ansible.builtin.file:
    path: /var/log/mariadb
    state: directory
    owner: root
    group: root

- name: Create MariaDB configuration directory
  ansible.builtin.file:
    path: /etc/my.cnf.d
    state: directory
    owner: root
    group: root

- name: Create MariaDB runtime directory
  ansible.builtin.file:
    path: /var/run/mariadb
    state: directory
    owner: mysql
    group: mysql
    mode: '0755'

- name: Configure MariaDB runtime directory for boot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/mariadb.conf
    content: |
      # Create the MariaDB runtime directory on boot
      d /var/run/mariadb 0755 mysql mysql -
    owner: root
    group: root
    mode: '0644'

- name: Backup MariaDB server.cnf
  ansible.builtin.stat:
    path: /etc/my.cnf.d/server.cnf.bak
  register: server_cnf_bak_stat

- name: Check if MariaDB server.cnf exists
  ansible.builtin.stat:
    path: /etc/my.cnf.d/server.cnf
  register: server_cnf_stat

- name: Backup MariaDB server.cnf
  ansible.builtin.copy:
    src: /etc/my.cnf.d/server.cnf
    mode: '0644'
    dest: /etc/my.cnf.d/server.cnf.bak
    remote_src: true
    force: false
  when: not server_cnf_bak_stat.stat.exists and server_cnf_stat.stat.exists
  changed_when: false

- name: Configure MariaDB server
  ansible.builtin.template:
    src: server.cnf.j2
    dest: /etc/my.cnf.d/server.cnf
    owner: root
    group: root
  notify: restart mariadb

- name: Backup MariaDB client.cnf
  ansible.builtin.stat:
    path: /etc/my.cnf.d/client.cnf.bak
  register: client_cnf_bak_stat

- name: Check if MariaDB client.cnf exists
  ansible.builtin.stat:
    path: /etc/my.cnf.d/client.cnf
  register: client_cnf_stat

- name: Backup MariaDB client.cnf
  ansible.builtin.copy:
    src: /etc/my.cnf.d/client.cnf
    mode: '0644'
    dest: /etc/my.cnf.d/client.cnf.bak
    remote_src: true
    force: false
  when: not client_cnf_bak_stat.stat.exists and client_cnf_stat.stat.exists
  changed_when: false

- name: Configure MariaDB client
  ansible.builtin.template:
    src: client.cnf.j2
    dest: /etc/my.cnf.d/client.cnf
    owner: root
    group: root

- name: Allow MariaDB port in SELinux
  community.general.seport:
    ports: "{{ db_port }}"
    proto: tcp
    setype: mysqld_port_t
    state: present
  when:
    - ansible_selinux.status is defined
    - ansible_selinux.status == "enabled"

- name: Enable and start MariaDB
  ansible.builtin.systemd:
    name: mariadb
    state: started
    enabled: true

- name: Check if mysql user exists
  ansible.builtin.command: id -u mysql
  register: mysql_user_check
  changed_when: false
  failed_when: false

- name: Ensure MariaDB log directory ownership is mysql:mysql when mysql user exists
  ansible.builtin.file:
    path: /var/log/mariadb
    state: directory
    owner: mysql
    group: mysql
    mode: '0755'
    recurse: yes
  when: mysql_user_check.rc == 0

- name: Run mariadb-upgrade after version change
  ansible.builtin.command: mariadb-upgrade --skip-version-check
  when:
    - ansible_os_family == "RedHat"
    - appstream_mariadb_installed.rc == 0
  failed_when: false
  changed_when: false

- name: Check if MariaDB is already secured
  ansible.builtin.stat:
    path: /var/lib/mysql/.mysql_setup_complete
    get_checksum: false
  register: mysql_setup_stat
 
- name: Set MariaDB root password
  community.mysql.mysql_user:
    name: root
    host: localhost
    password: "{{ db_root_password }}"
    plugin: mysql_native_password
    check_implicit_admin: yes
    login_unix_socket: /var/lib/mysql/mysql.sock
    state: present
  when: not mysql_setup_stat.stat.exists and db_root_password is defined and (db_root_password | length) > 0
  no_log: true
  register: set_root_password
  failed_when: false

- name: Create root credentials file (when password set)
  ansible.builtin.template:
    src: root.my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: '0600'
  when: not mysql_setup_stat.stat.exists and db_root_password is defined and (db_root_password | length) > 0

- name: Secure MariaDB installation (module-based)
  block:
    - name: Try disallow root login remotely via socket
      community.mysql.mysql_query:
        login_unix_socket: /var/lib/mysql/mysql.sock
        query: "DELETE FROM mysql.user WHERE User='root' AND Host NOT IN ('localhost','127.0.0.1'); FLUSH PRIVILEGES;"
      register: disallow_remote_socket
      failed_when: false

    - name: Disallow root login remotely (password auth fallback)
      community.mysql.mysql_query:
        login_user: root
        login_password: "{{ db_root_password }}"
        query: "DELETE FROM mysql.user WHERE User='root' AND Host NOT IN ('localhost','127.0.0.1'); FLUSH PRIVILEGES;"
      when: (disallow_remote_socket is defined and (disallow_remote_socket.failed | default(false))) and db_root_password is defined and (db_root_password | length) > 0

    - name: Try flush privileges via socket
      community.mysql.mysql_query:
        login_unix_socket: /var/lib/mysql/mysql.sock
        query: "FLUSH PRIVILEGES;"
      register: flush_socket
      failed_when: false

    - name: Flush privileges (password auth fallback)
      community.mysql.mysql_query:
        login_user: root
        login_password: "{{ db_root_password }}"
        query: "FLUSH PRIVILEGES;"
      when: (flush_socket is defined and (flush_socket.failed | default(false))) and db_root_password is defined and (db_root_password | length) > 0

    - name: Create setup complete flag file
      ansible.builtin.file:
        path: /var/lib/mysql/.mysql_setup_complete
        state: touch
        owner: mysql
        group: mysql
  when: not mysql_setup_stat.stat.exists

- name: Try remove anonymous MariaDB users on every setup run
  community.mysql.mysql_query:
    login_unix_socket: /var/lib/mysql/mysql.sock
    query: "DELETE FROM mysql.user WHERE User=''; FLUSH PRIVILEGES;"
  register: remove_anonymous_socket
  when: db_remove_anonymous_users | default(true) | bool
  failed_when: false

- name: Remove anonymous MariaDB users with password authentication fallback
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ db_root_password }}"
    query: "DELETE FROM mysql.user WHERE User=''; FLUSH PRIVILEGES;"
  when:
    - db_remove_anonymous_users | default(true) | bool
    - remove_anonymous_socket.failed | default(false)
    - db_root_password is defined
    - (db_root_password | length) > 0
  failed_when: false
  changed_when: false

- name: Try remove test databases on every MariaDB setup run
  community.mysql.mysql_query:
    login_unix_socket: /var/lib/mysql/mysql.sock
    query: "DROP DATABASE IF EXISTS test; DROP DATABASE IF EXISTS Test;"
  register: remove_test_database_socket
  when: db_remove_test_database | default(true) | bool
  failed_when: false

- name: Remove test databases with password authentication fallback
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ db_root_password }}"
    query: "DROP DATABASE IF EXISTS test; DROP DATABASE IF EXISTS Test;"
  when:
    - db_remove_test_database | default(true) | bool
    - remove_test_database_socket.failed | default(false)
    - db_root_password is defined
    - (db_root_password | length) > 0
  failed_when: false
  changed_when: false

# Create specific database users matching the bash script implementation
- name: Create standard database users (password auth)
  community.mysql.mysql_user:
    login_user: root
    login_password: "{{ db_root_password }}"
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    host: "{{ item.host }}"
    priv: "{{ item.priv }}"
    state: present
  loop:
    - { name: "{{ db_remote_user | default('remote_user') }}", password: "{{ db_remote_password | default(db_root_password) }}", host: '%', priv: '*.*:ALL' }
    - { name: 'webclient', password: "{{ db_webclient_password | default(db_root_password) }}", host: 'localhost', priv: '*.*:ALL' }
  when: db_root_password is defined and (db_root_password | length) > 0
  register: create_users_result
  failed_when: false

- name: Create standard database users (socket auth fallback)
  community.mysql.mysql_user:
    login_unix_socket: /var/lib/mysql/mysql.sock
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    host: "{{ item.host }}"
    priv: "{{ item.priv }}"
    state: present
  loop:
    - { name: "{{ db_remote_user | default('remote_user') }}", password: "{{ db_remote_password | default(db_root_password) }}", host: '%', priv: '*.*:ALL' }
    - { name: 'webclient', password: "{{ db_webclient_password | default(db_root_password) }}", host: 'localhost', priv: '*.*:ALL' }
  when: db_root_password is not defined or (db_root_password | length) == 0 or (create_users_result is defined and (create_users_result.failed | default(false)))
    

- name: Create database backup directory
  ansible.builtin.file:
    path: "{{ db_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install per-database MariaDB backup script
  ansible.builtin.template:
    src: database-backup.sh.j2
    dest: /usr/local/sbin/mariadb-backup-and-email.sh
    owner: root
    group: root
    mode: '0700'

- name: Setup automatic database backups
  ansible.builtin.cron:
    name: "Database backup"
    hour: "3"
    minute: "0"
    job: "/usr/local/sbin/mariadb-backup-and-email.sh"
    user: root
  when: setup_db_backups | default(true)

- name: Configure tune-db settings
  ansible.builtin.include_tasks: performance.yml
  when: db_optimize_for_server | default(true)
